<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Clear Board">
  <!-- Clear Board icon concept: the lit lamp. Master drawing. Every colour is a Dusk 0.2.0 token value; see icon-lamp.notes.md. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13101b"/>
      <stop offset="1" stop-color="#0d0b14"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="256" cy="256" r="138" gradientUnits="userSpaceOnUse">
      <stop offset="0.68" stop-color="#3fbf7a" stop-opacity="0.50"/>
      <stop offset="0.82" stop-color="#3fbf7a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fbf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampCore" cx="256" cy="256" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="near" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="104" y="104" width="304" height="304" rx="56"/>
    </clipPath>
  </defs>

  <!-- the floor -->
  <rect width="512" height="512" rx="96" fill="#0a0810"/>

  <!-- the glow of the lit line on the floor -->
  <g clip-path="url(#tileClip)" fill="none">
    <rect x="104" y="104" width="304" height="304" rx="56" stroke="#e0864a" stroke-opacity="0.50" stroke-width="30" filter="url(#soft)"/>
    <rect x="104" y="104" width="304" height="304" rx="56" stroke="#f2c27a" stroke-opacity="0.38" stroke-width="22" filter="url(#near)"/>
  </g>

  <!-- the panel -->
  <rect x="104" y="104" width="304" height="304" rx="56" fill="url(#panel)"/>

  <!-- the lamp glow on the panel -->
  <g clip-path="url(#panelClip)">
    <circle cx="256" cy="256" r="138" fill="url(#lampGlow)"/>
  </g>

  <!-- the lit line -->
  <rect x="104" y="104" width="304" height="304" rx="56" fill="none" stroke="#f2c27a" stroke-width="16"/>

  <!-- the lamp: a dark seat, then the lit lens -->
  <circle cx="256" cy="256" r="96" fill="#07060b"/>
  <circle cx="256" cy="256" r="80" fill="#3fbf7a"/>
  <circle cx="256" cy="256" r="80" fill="url(#lampCore)"/>
</svg>
