:root{

  /* ==========================================================================
     1 · THE WALL — the ornament. Four stops and a disc, approved 2026-10-20
         and never solved: every semantic colour is solved AROUND them
         (SKIN-05). Since 0.2.0 the wall is no longer the ground. It is the
         LIGHT: its gold edges every container, its four stops run under the
         title bar as one thread, and a dim horizon of it sits on the floor.
     ========================================================================== */
  --wall-1:           #2b1d3a;  /* plum, the dark end                          */
  --wall-2:           #7a3b4a;  /* rose                                        */
  --wall-3:           #e0864a;  /* ember                                       */
  --wall-4:           #f2c27a;  /* gold, the brightest stop, and the lit line  */
  --wall:             radial-gradient(120% 80% at 50% 120%, var(--wall-4) 0%, var(--wall-3) 22%, var(--wall-2) 48%, var(--wall-1) 78%);
  --thread:           linear-gradient(90deg, var(--wall-1), var(--wall-2) 22%, var(--wall-3) 48%, var(--wall-4) 62%, rgba(242,194,122,0) 96%);  /* the line under the title bar */

  --disc-hi:          #ffd9a0;
  --disc-mid:         var(--wall-3);  /* the sketch's #c8643e read as attention red (9.2). Takes the wall's own colour. */
  --disc-lo:          #3a2448;
  --disc:             radial-gradient(circle at 35% 30%, var(--disc-hi), var(--disc-mid) 55%, var(--disc-lo));
  --disc-ink:         var(--wall-1);  /* the glyph in the disc */

  /* ==========================================================================
     2 · SURFACES — opaque, near-black, stepped. Nothing is translucent glass
         any more, so the three inks can sit apart (the 0.1.0 glass forced all
         three near white). --glass and --glass-side keep their names so a page
         that reads them keeps working; both are solid now.
     ========================================================================== */
  --ground-0:         #07060b;  /* the page floor                              */
  --ground:           radial-gradient(120% 70% at 50% 125%, rgba(224,134,74,0.30) 0%, rgba(122,59,74,0.22) 30%, rgba(43,29,58,0) 68%);  /* the horizon: the wall, dimmed, on the floor. The OPEN tier drifts it. */
  --glass:            #0a0810;  /* the window floor                            */
  --glass-side:       #08070c;  /* the sidebar and the status bar              */
  --panel-hi:         #13101b;  /* a panel, a tile and the strip: light end. Text is measured on this end. */
  --panel-lo:         #0d0b14;
  --panel-fill:       linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
  --bar:              linear-gradient(180deg, #110e18, #0b0911);  /* the title bar */
  --head:             #17131f;  /* a panel's head bar                          */
  --thead:            #14111c;  /* a table's head row                          */
  --well:             #07060b;  /* a sunk slot: count chip, tag, segmented track, bar track, an unlit icon square */
  --hair:             rgba(255,255,255,0.075);
  --hair-2:           rgba(255,255,255,0.15);
  --wash-1:           rgba(255,255,255,0.05);    /* row hover                 */
  --wash-2:           rgba(242,194,122,0.10);    /* lit: the current row, a pressed segment */
  --wash-3:           rgba(190,160,255,0.045);   /* a page's own panel over the window floor; lands on --panel-hi within two steps */
  --wash-4:           rgba(242,194,122,0.10);    /* the hot table row         */
  --zebra:            rgba(255,255,255,0.014);   /* every second table row    */
  --idle:             rgba(255,255,255,0.25);    /* the idle share of a bar   */
  --blur:             none;                      /* there is no glass to blur; the name stays for pages that read it */

  /* ==========================================================================
     3 · INK — text. Each is measured on every surface it sits on. ink-2 and
         ink-3 are solved to a target ABOVE the AA floor (solve.config.json,
         ink.target2 and ink.target3): the owner's "C's contrast".
     ========================================================================== */
  --ink:              #f4f1ec;
  --ink-2:            #c8c3d0;  /* solved: the sketch's #b9b3c4, raised to its target on the worst surface */
  --ink-3:            #9d98a9;  /* solved: the sketch's #8c869a, raised to its target on the worst surface */
  --dot:              var(--ink-2);  /* the three window dots: one monochrome ink, so they cannot read as red, amber and green. ink-2 since 0.2.0: the darker ink-3 sat 9.7 from --grey, under the 15 floor. */
  --on-tile:          #ffffff;       /* text on a tile's coloured cap */
  --lit:              var(--wall-4); /* the lit line as text: a count, a pressed control, the button's word. Chrome and selection, never a state. */
  --btn-bg:           rgba(242,194,122,0.10);
  --btn-bg-hover:     rgba(242,194,122,0.18);
  --btn-bg-press:     rgba(242,194,122,0.26);
  --btn-ink:          var(--lit);
  --focus:            #9fc4ff;

  /* ==========================================================================
     4 · SEMANTIC — each colour is a FILL and an INK. The fill paints bars, dots,
         caps and glows. The ink is what text and a tile's lit edge use. Red is
         for attention only. Teal is information, never a state. There is no gold
         state: gold is the light.
     ========================================================================== */
  --red:              #e2574c;
  --red-ink:          #ea5d50;
  --amber:            #cc8f00;
  --amber-ink:        #cc8f00;
  --green:            #3fbf7a;
  --green-ink:        #3fbf79;
  --down:             #e96f8b;
  --down-ink:         #eb708d;
  --teal:             #2fb3ad;
  --teal-ink:         #31b3ad;

  --attn:             var(--red);
  --attn-ink:         var(--red-ink);
  --up:               var(--green);
  --up-ink:           var(--green-ink);

  /* information colours: lane and category fills. Never a state. Since 0.2.0 each has an ink too,
     for its own tile's glyph, tag, sparkline and lit edge, and for nothing else. */
  --blue:             #3d8bf2;
  --blue-ink:         #3d8bf2;
  --violet:           #8e6cf2;
  --violet-ink:       #9574f9;
  --grey:             #7d8494;
  --grey-ink:         #828dab;

  /* each fill as an r,g,b triplet, written by the solver from the fill above, for the glows below */
  --red-rgb:         226,87,76;
  --amber-rgb:         204,143,0;
  --green-rgb:         63,191,122;
  --down-rgb:         233,111,139;
  --teal-rgb:         47,179,173;
  --blue-rgb:         61,139,242;
  --violet-rgb:         142,108,242;
  --grey-rgb:         125,132,148;

  /* ==========================================================================
     5 · TILES — a dark body under a coloured cap. The cap is a gradient, light
         end to dark end, and white text sits on it, so the light end is solved
         until white >= 4.5.
     ========================================================================== */
  --tile-red-hi:      #dc3629;
  --tile-red-lo:      #9c2a3a;
  --tile-amber-hi:    #9c6d00;
  --tile-amber-lo:    #5f4200;
  --tile-green-hi:    #2c8555;
  --tile-green-lo:    #1d6b4a;
  --tile-down-hi:     #df2a54;
  --tile-down-lo:     #8a2a3e;
  --tile-teal-hi:     #22817c;
  --tile-teal-lo:     #156a6b;
  --tile-blue-hi:     #1070ef;
  --tile-blue-lo:     #1d4f9c;
  --tile-violet-hi:   #8059f0;
  --tile-violet-lo:   #4a2f9c;
  --tile-grey-hi:     #6f7686;
  --tile-grey-lo:     #3d4250;
  --tile-angle:       180deg;
  --tile-red:        linear-gradient(var(--tile-angle), var(--tile-red-hi), var(--tile-red-lo));
  --tile-amber:        linear-gradient(var(--tile-angle), var(--tile-amber-hi), var(--tile-amber-lo));
  --tile-green:        linear-gradient(var(--tile-angle), var(--tile-green-hi), var(--tile-green-lo));
  --tile-down:        linear-gradient(var(--tile-angle), var(--tile-down-hi), var(--tile-down-lo));
  --tile-teal:        linear-gradient(var(--tile-angle), var(--tile-teal-hi), var(--tile-teal-lo));
  --tile-blue:        linear-gradient(var(--tile-angle), var(--tile-blue-hi), var(--tile-blue-lo));
  --tile-violet:        linear-gradient(var(--tile-angle), var(--tile-violet-hi), var(--tile-violet-lo));
  --tile-grey:        linear-gradient(var(--tile-angle), var(--tile-grey-hi), var(--tile-grey-lo));
  --tile-glyph:       rgba(0,0,0,0.26);  /* the icon square on a cap: a sunk dark square, which raises the white glyph's contrast. tests/skin05-contrast.mjs measures the glyph on it over both cap ends. */
  --tile-spark:       0.2;               /* the opacity of the area under a sparkline, painted in the tile's own fill */
  --tint-alpha:       0.15;              /* how much of its fill a tile body carries at the top; text is measured on it */
  --tint-red:        linear-gradient(180deg, rgba(var(--red-rgb),var(--tint-alpha)), rgba(var(--red-rgb),0) 66%);
  --tint-amber:        linear-gradient(180deg, rgba(var(--amber-rgb),var(--tint-alpha)), rgba(var(--amber-rgb),0) 66%);
  --tint-green:        linear-gradient(180deg, rgba(var(--green-rgb),var(--tint-alpha)), rgba(var(--green-rgb),0) 66%);
  --tint-down:        linear-gradient(180deg, rgba(var(--down-rgb),var(--tint-alpha)), rgba(var(--down-rgb),0) 66%);
  --tint-teal:        linear-gradient(180deg, rgba(var(--teal-rgb),var(--tint-alpha)), rgba(var(--teal-rgb),0) 66%);
  --tint-blue:        linear-gradient(180deg, rgba(var(--blue-rgb),var(--tint-alpha)), rgba(var(--blue-rgb),0) 66%);
  --tint-violet:        linear-gradient(180deg, rgba(var(--violet-rgb),var(--tint-alpha)), rgba(var(--violet-rgb),0) 66%);
  --tint-grey:        linear-gradient(180deg, rgba(var(--grey-rgb),var(--tint-alpha)), rgba(var(--grey-rgb),0) 66%);

  /* ==========================================================================
     6 · LIGHT — the lit line. A container's edge is a bright 1px core, a soft
         outer glow and a faint inner glow. Panels, the strip and controls are
         lit in the wall's gold. A tile is lit in its own colour. Nothing here
         moves: a glow is a still shadow, so reduced motion has nothing to stop.
     ========================================================================== */
  --lit-line:         rgba(242,194,122,0.55);  /* a container's edge            */
  --lit-rule:         rgba(242,194,122,0.30);  /* a rule inside one: under a head, between cells, the sidebar's edge */
  --neon:             0 0 0 1px var(--lit-line), 0 0 11px -2px rgba(242,194,122,0.38), 0 0 30px -10px rgba(224,134,74,0.50), inset 0 0 24px -16px rgba(242,194,122,0.60), inset 0 1px 0 rgba(255,255,255,0.05);
  --neon-on:          0 0 0 1px rgba(242,194,122,0.85), 0 0 14px -1px rgba(242,194,122,0.55), 0 0 36px -8px rgba(224,134,74,0.65), inset 0 0 26px -14px rgba(242,194,122,0.70), inset 0 1px 0 rgba(255,255,255,0.05);  /* arrived, hovered */
  --neon-ctl:         0 0 0 1px rgba(242,194,122,0.75), 0 0 10px -2px rgba(242,194,122,0.60);  /* a control: button, badge, pressed segment */
  --neon-ctl-on:      0 0 0 1px var(--wall-4), 0 0 14px -1px rgba(242,194,122,0.80);
  --neon-row:         inset 0 1px 0 rgba(242,194,122,0.75), inset 0 -1px 0 rgba(242,194,122,0.75);  /* the hot table row: lit above and below */
  --glow-thread:      0 0 14px rgba(224,134,74,0.75), 0 0 3px rgba(242,194,122,0.90);
  --ring-well:        inset 0 0 0 1px rgba(255,255,255,0.10);
  --rule-fade:        linear-gradient(90deg, rgba(242,194,122,0.50), rgba(242,194,122,0));  /* the line of a named rule */
  --neon-red:        0 0 0 1px var(--red-ink), 0 0 10px 0 rgba(var(--red-rgb),0.62), 0 0 30px -6px var(--red), inset 0 0 22px -12px var(--red);
  --neon-amber:        0 0 0 1px var(--amber-ink), 0 0 10px 0 rgba(var(--amber-rgb),0.62), 0 0 30px -6px var(--amber), inset 0 0 22px -12px var(--amber);
  --neon-green:        0 0 0 1px var(--green-ink), 0 0 10px 0 rgba(var(--green-rgb),0.62), 0 0 30px -6px var(--green), inset 0 0 22px -12px var(--green);
  --neon-down:        0 0 0 1px var(--down-ink), 0 0 10px 0 rgba(var(--down-rgb),0.62), 0 0 30px -6px var(--down), inset 0 0 22px -12px var(--down);
  --neon-teal:        0 0 0 1px var(--teal-ink), 0 0 10px 0 rgba(var(--teal-rgb),0.62), 0 0 30px -6px var(--teal), inset 0 0 22px -12px var(--teal);
  --neon-blue:        0 0 0 1px var(--blue-ink), 0 0 10px 0 rgba(var(--blue-rgb),0.62), 0 0 30px -6px var(--blue), inset 0 0 22px -12px var(--blue);
  --neon-violet:        0 0 0 1px var(--violet-ink), 0 0 10px 0 rgba(var(--violet-rgb),0.62), 0 0 30px -6px var(--violet), inset 0 0 22px -12px var(--violet);
  --neon-grey:        0 0 0 1px var(--grey-ink), 0 0 10px 0 rgba(var(--grey-rgb),0.62), 0 0 30px -6px var(--grey), inset 0 0 22px -12px var(--grey);
  --neon-red-on:     0 0 0 1px var(--red-ink), 0 0 15px 1px rgba(var(--red-rgb),0.85), 0 0 40px -4px var(--red), inset 0 0 26px -10px var(--red);
  --neon-amber-on:     0 0 0 1px var(--amber-ink), 0 0 15px 1px rgba(var(--amber-rgb),0.85), 0 0 40px -4px var(--amber), inset 0 0 26px -10px var(--amber);
  --neon-green-on:     0 0 0 1px var(--green-ink), 0 0 15px 1px rgba(var(--green-rgb),0.85), 0 0 40px -4px var(--green), inset 0 0 26px -10px var(--green);
  --neon-down-on:     0 0 0 1px var(--down-ink), 0 0 15px 1px rgba(var(--down-rgb),0.85), 0 0 40px -4px var(--down), inset 0 0 26px -10px var(--down);
  --neon-teal-on:     0 0 0 1px var(--teal-ink), 0 0 15px 1px rgba(var(--teal-rgb),0.85), 0 0 40px -4px var(--teal), inset 0 0 26px -10px var(--teal);
  --neon-blue-on:     0 0 0 1px var(--blue-ink), 0 0 15px 1px rgba(var(--blue-rgb),0.85), 0 0 40px -4px var(--blue), inset 0 0 26px -10px var(--blue);
  --neon-violet-on:     0 0 0 1px var(--violet-ink), 0 0 15px 1px rgba(var(--violet-rgb),0.85), 0 0 40px -4px var(--violet), inset 0 0 26px -10px var(--violet);
  --neon-grey-on:     0 0 0 1px var(--grey-ink), 0 0 15px 1px rgba(var(--grey-rgb),0.85), 0 0 40px -4px var(--grey), inset 0 0 26px -10px var(--grey);
  --rowneon-red:     0 0 0 1px var(--red-ink), 0 0 12px -1px rgba(var(--red-rgb),0.70), inset 0 0 16px -8px var(--red);
  --rowneon-amber:     0 0 0 1px var(--amber-ink), 0 0 12px -1px rgba(var(--amber-rgb),0.70), inset 0 0 16px -8px var(--amber);
  --rowneon-green:     0 0 0 1px var(--green-ink), 0 0 12px -1px rgba(var(--green-rgb),0.70), inset 0 0 16px -8px var(--green);
  --rowneon-down:     0 0 0 1px var(--down-ink), 0 0 12px -1px rgba(var(--down-rgb),0.70), inset 0 0 16px -8px var(--down);
  --rowneon-teal:     0 0 0 1px var(--teal-ink), 0 0 12px -1px rgba(var(--teal-rgb),0.70), inset 0 0 16px -8px var(--teal);
  --rowneon-blue:     0 0 0 1px var(--blue-ink), 0 0 12px -1px rgba(var(--blue-rgb),0.70), inset 0 0 16px -8px var(--blue);
  --rowneon-violet:     0 0 0 1px var(--violet-ink), 0 0 12px -1px rgba(var(--violet-rgb),0.70), inset 0 0 16px -8px var(--violet);
  --rowneon-grey:     0 0 0 1px var(--grey-ink), 0 0 12px -1px rgba(var(--grey-rgb),0.70), inset 0 0 16px -8px var(--grey);
  --rowwash-red:     rgba(var(--red-rgb),0.14);
  --rowwash-amber:     rgba(var(--amber-rgb),0.14);
  --rowwash-green:     rgba(var(--green-rgb),0.14);
  --rowwash-down:     rgba(var(--down-rgb),0.14);
  --rowwash-teal:     rgba(var(--teal-rgb),0.14);
  --rowwash-blue:     rgba(var(--blue-rgb),0.14);
  --rowwash-violet:     rgba(var(--violet-rgb),0.14);
  --rowwash-grey:     rgba(var(--grey-rgb),0.14);
  --cap-red:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--red);

  --cap-green:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--green);
  --cap-down:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--down);
  --cap-teal:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--teal);
  --cap-blue:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--blue);
  --cap-violet:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--violet);
  --cap-grey:         inset 0 1px 0 rgba(255,255,255,0.28), 0 3px 12px -2px var(--grey);
  --glow-red:        0 0 7px rgba(var(--red-rgb),0.80);
  --glow-amber:        0 0 7px rgba(var(--amber-rgb),0.80);
  --glow-green:        0 0 7px rgba(var(--green-rgb),0.80);
  --glow-down:        0 0 7px rgba(var(--down-rgb),0.80);
  --glow-teal:        0 0 7px rgba(var(--teal-rgb),0.80);
  --glow-blue:        0 0 7px rgba(var(--blue-rgb),0.80);
  --glow-violet:        0 0 7px rgba(var(--violet-rgb),0.80);
  --glow-grey:        0 0 7px rgba(var(--grey-rgb),0.80);
  --halo-red:        0 0 16px rgba(var(--red-rgb),0.55);
  --halo-amber:        0 0 16px rgba(var(--amber-rgb),0.55);
  --halo-green:        0 0 16px rgba(var(--green-rgb),0.55);
  --halo-down:        0 0 16px rgba(var(--down-rgb),0.55);
  --halo-teal:        0 0 16px rgba(var(--teal-rgb),0.55);
  --halo-blue:        0 0 16px rgba(var(--blue-rgb),0.55);
  --halo-violet:        0 0 16px rgba(var(--violet-rgb),0.55);
  --halo-grey:        0 0 16px rgba(var(--grey-rgb),0.55);

  /* ==========================================================================
     6b · SHAPE — corners and elevation. There is no pill token: a control
          cannot be made a pill from a token.
     ========================================================================== */
  --r-window:         10px;
  --r-tile:           8px;   /* tiles, panels, the strip */
  --r-icon:           6px;
  --r-control:        6px;   /* every button, input, row highlight and badge */
  --r-chip:           4px;   /* a count, a tag, a segment */
  --r-bar:            4px;
  --r-circle:         50%;   /* for equal-sided dots and the disc only, never a control */

  --shadow-win:       0 0 0 1px var(--lit-rule), 0 24px 60px rgba(0,0,0,0.60);  /* a window that floats on a stage of several */
  --shadow-disc:      0 8px 20px rgba(0,0,0,0.4);
  --shadow-tile:      inset 0 1px 0 rgba(255,255,255,0.12);  /* 0.1.0's tile highlight, unchanged. No part here reads it; a page that does keeps what it had. */

  /* ==========================================================================
     7 · TYPE — the system stack. No web font, no font file, no CDN.
     ========================================================================== */
  --font-ui:          -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-mono:        ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;  /* every figure. A system stack: still no web font and no font file. */
  --fs-xs:            11px;
  --fs-s:             12px;
  --fs-data:          13px;
  --fs-base:          14px;
  --fs-l:             15px;
  --fs-title:         20px;
  --fs-num:           27px;
  --lh-base:          1.45;
  --lh-tight:         1.1;
  --track-title:      -0.01em;
  --track-num:        -0.02em;
  --track-label:      0.07em;
  --fw-medium:        600;
  --fw-bold:          700;

  /* ==========================================================================
     8 · SPACE
     ========================================================================== */
  --gap:              12px;
  --gutter:           var(--sp-6);
  --sp-1:             4px;
  --sp-2:             6px;
  --sp-3:             8px;
  --sp-4:             10px;
  --sp-5:             12px;
  --sp-6:             16px;
  --sp-7:             18px;
  --sp-8:             20px;
  --side-w:           212px;
  --bar-h-title:      42px;  /* the title bar */
  --thread-h:         2px;
  --head-h:           36px;  /* a panel's head bar */
  --cap-h:            30px;  /* a tile's cap */
  --row-h:            29px;  /* a table row */
  --status-h:         26px;
  --ico-size-sm:      20px;  /* the icon square on a tile cap */
  --disc-size-xs:     18px;  /* the brand disc in the title bar */
  --led-size:         7px;
  --heat-h:           6px;
  --bar-col:          22%;   /* the share of a table a drawn-measure column takes */
  --spark-w:          1.5px;
  --label-w:          96px;
  --tile-min:         176px;
  --tile-h:           138px;
  --measure:          78ch;
  --pair-min:         620px;
  --panel-min:        320px;
  --chip-min:         150px;
  --dot-size:         11px;
  --disc-size:        74px;
  --disc-size-sm:     36px;  /* a station's disc on the process track */
  --label-w-lanes:    190px; /* the loop label column of .dusk-lanes */
  --ico-size:         24px;
  --legend-dot:       9px;
  --bar-h:            14px;
  --spark-h:          34px;
  --track-w:          2px;   /* the process track's spine (CR-2026-10-22-PROCESS) */
  --lane-h:           14px;  /* a loop lane's bar */
  --diagram-wrap:     240px; /* the widest a Mermaid node label grows before it wraps (lib\mermaid-dusk.js) */
  --traveller-size:   10px;  /* the mark that rides a process track (CR-2026-10-22-LIVING) */
  --travel-y:         0px;   /* how far the traveller rides. A page sets the real length on the mark; declared here so no page reads an undeclared name. */
  --ring-w:           3px;   /* the ring on the current station's disc */
  --shadow-disc-ring: var(--shadow-disc), 0 0 0 var(--ring-w) var(--amber);  /* the disc's shadow plus the current-station ring */
  --focus-w:          2px;
  --focus-off:        2px;

  /* ==========================================================================
     9 · MOTION — durations, distances and easing. Nothing here is read by
         the STRICT tier except the Tier 1 lift. See ARCHITECTURE.md.
     ========================================================================== */
  --m-confirm:        160ms;   /* Tier 1: hover, focus, press             */
  --ease:             ease;
  --lift:             -2px;
  --m-enter:          420ms;   /* Tier 2, OPEN only                       */
  --m-ride:           6000ms;  /* Tier 2, OPEN only: the traveller's one pass down a process track (CR-2026-10-22-LIVING, A1) */
  --enter-shift:      8px;
  --m-drift:          120s;    /* Tier 3, OPEN only: the horizon's slow drift */
  --drift-x:          2vw;
  --drift-y:          -1.5vh;
  --drift-bleed:      -4%;     /* the horizon layer is a little oversize so a drift never shows an edge; it is oversize at rest too, so both tiers look alike */
}

/* ===== dusk.base.css — verbatim copy, do not edit ===== */
/* dusk.base.css - layer 2 of 5. The ground, the type defaults, the focus ring.
   Reads tokens. Defines no raw colour, duration, radius or shadow. Contains no dusk- part
   except the two page utilities below. */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html,
body { margin: 0; }

body {
  min-height: 100vh;
  color: var(--ink);
  font: var(--fs-data) / var(--lh-base) var(--font-ui);
  background: var(--ground-0);
}

/* The horizon: the wall, dimmed, low on the near-black floor. One fixed layer behind everything, a
   little oversize (--drift-bleed) so the OPEN tier can drift it without showing an edge. STRICT
   leaves it still. Same geometry on both tiers. A window is opaque, so the horizon shows only in
   the gutter around a floating window; a page that is one whole window (.dusk-stage--app) covers it. */
body::before {
  content: "";
  position: fixed;
  inset: var(--drift-bleed);
  z-index: -1;
  pointer-events: none;
  background: var(--ground);
}

h1,
h2,
h3,
p { margin: 0; }

h1,
h2,
h3 { font-weight: var(--fw-bold); }

a { color: inherit; }

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

table,
time,
.dusk-num { font-variant-numeric: tabular-nums; }

/* a figure: the mono stack, tabular */
.dusk-num { font-family: var(--font-mono); }

/* Focus is never removed. One ring for every interactive part. */
:focus-visible {
  outline: var(--focus-w) solid var(--focus);
  outline-offset: var(--focus-off);
}

/* Page utilities */
.dusk-skip {
  position: absolute;
  left: var(--sp-3);
  top: calc(-1 * var(--tile-h));
  z-index: 10;
  padding: var(--sp-4) var(--sp-6);
  border-radius: var(--r-control);
  background: var(--btn-bg);
  color: var(--btn-ink);
  font-weight: var(--fw-medium);
}
.dusk-skip:focus { top: var(--sp-3); }

.dusk-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ===== dusk.components.css — verbatim copy, do not edit ===== */
/* dusk.components.css - layer 3 of 5. The parts, and their Tier 1 states (hover, focus, press).
   Owns colour, fill, border, corner, shadow and type of each part. Does not own where a part sits:
   display, grid, gap, padding and margin are dusk.compose.css. Reads tokens only.

   0.2.0, the lit panel. Three rules run through every part below:
     1. A container has a lit edge, not a border: one shadow token (--neon, --neon-<tone>).
        Gold light is chrome and selection. A tile is lit in its own colour.
     2. A part that takes a tone sets local names (--tile-*, --row-*, --ico-*) from the tone's
        tokens, and the part's rules read the local names. A local name is never a raw value.
     3. Every status or market state carries a glyph or a word as well as a colour (SKIN-05).
        A glow is never the only carrier either. */

/* ---- window, title bar, sidebar, status bar --------------------------------------------------- */

.dusk-win {
  background: var(--glass);
  border-radius: var(--r-window);
  box-shadow: var(--shadow-win);
  overflow: hidden;
}
/* one window that is the whole page: no corner, no float */
.dusk-stage--app > .dusk-win {
  border-radius: 0;
  box-shadow: none;
}

.dusk-titlebar { background: var(--bar); }
.dusk-thread {
  background: var(--thread);
  box-shadow: var(--glow-thread);
}
.dusk-brand { font-weight: var(--fw-medium); }
.dusk-crumb { color: var(--ink-3); }
.dusk-crumb b { color: var(--ink); font-weight: var(--fw-medium); }
.dusk-crumb i { font-style: normal; }
.dusk-clock {
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: var(--fs-s);
}

.dusk-side {
  background: var(--glass-side);
  border-right: 1px solid var(--lit-rule);
}
.dusk-side-foot {
  border-top: 1px solid var(--lit-rule);
  color: var(--ink-3);
  font-size: var(--fs-xs);
}
.dusk-side-foot b { color: var(--ink-2); font-size: var(--fs-s); font-weight: var(--fw-medium); }

.dusk-status {
  background: var(--glass-side);
  border-top: 1px solid var(--lit-rule);
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.dusk-status > span + span { border-left: 1px solid var(--hair); }
.dusk-status > .dusk-spacer + span { border-left: 0; }
/* a lamp. It is always beside its word; the colour is never the only carrier. */
.dusk-led {
  background: var(--ink-3);
  border-radius: var(--r-circle);
}
.dusk-led--ok      { background: var(--green); box-shadow: var(--glow-green); }
.dusk-led--caution { background: var(--amber); box-shadow: var(--glow-amber); }
.dusk-led--attn    { background: var(--red);   box-shadow: var(--glow-red); }

.dusk-dots i {
  background: var(--dot);
  border-radius: var(--r-circle);
}

.dusk-disc {
  background: var(--disc);
  border-radius: var(--r-circle);
  box-shadow: var(--shadow-disc);
  color: var(--disc-ink);
  font-weight: var(--fw-bold);
}

.dusk-who { text-align: center; }
.dusk-who span { color: var(--ink-3); font-size: var(--fs-s); }

.dusk-grp {
  color: var(--ink-3);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--track-label);
}

/* ---- row and icon square ------------------------------------------------------------------------
   A row is unlit until it is the current one. Then it is lit: in gold, or in its own tone when the
   row carries one (.dusk-row--teal). The icon square inside is a dark slot edged in its tone, and
   it fills when its row is lit. A square outside a row fills with .dusk-ico--solid. The square reads
   --ico-edge and --ico-ink from its row or from its own tone class, and falls back to grey; it
   declares neither itself, or it would hide the row's. */

.dusk-row {
  --row-neon: var(--neon-ctl);
  --row-wash: var(--wash-2);
  color: var(--ink-2);
  border-radius: var(--r-control);
  text-decoration: none;
  transition: background-color var(--m-confirm) var(--ease), box-shadow var(--m-confirm) var(--ease);
}
.dusk-row b { color: var(--ink); font-weight: var(--fw-medium); line-height: 1.2; }
.dusk-row small {
  color: var(--ink-3);
  font-size: var(--fs-xs);
  line-height: 1.25;
}
.dusk-row:hover { background: var(--wash-1); }
.dusk-row--on,
.dusk-row--on:hover,
.dusk-row[aria-current="page"],
.dusk-row[aria-current="page"]:hover {
  background: var(--row-wash);
  color: var(--ink);
  box-shadow: var(--row-neon);
}
/* ink-3 is not measured on a lit row, ink-2 is */
.dusk-row--on small,
.dusk-row[aria-current="page"] small { color: var(--ink-2); }

.dusk-ico {
  background: var(--well);
  border: 1px solid var(--ico-edge, var(--tile-grey-hi));
  border-radius: var(--r-icon);
  color: var(--ico-ink, var(--grey-ink));
  font-weight: var(--fw-bold);
  font-size: var(--fs-s);
  line-height: 1;
}
.dusk-ico svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.dusk-ico--red,
.dusk-row--red { --ico-edge: var(--tile-red-hi); --ico-ink: var(--red-ink); }
.dusk-ico--amber,
.dusk-row--amber { --ico-edge: var(--tile-amber-hi); --ico-ink: var(--amber-ink); }
.dusk-ico--green,
.dusk-row--green { --ico-edge: var(--tile-green-hi); --ico-ink: var(--green-ink); }
.dusk-ico--down,
.dusk-row--down { --ico-edge: var(--tile-down-hi); --ico-ink: var(--down-ink); }
.dusk-ico--teal,
.dusk-row--teal { --ico-edge: var(--tile-teal-hi); --ico-ink: var(--teal-ink); }
.dusk-ico--blue,
.dusk-row--blue { --ico-edge: var(--tile-blue-hi); --ico-ink: var(--blue-ink); }
.dusk-ico--violet,
.dusk-row--violet { --ico-edge: var(--tile-violet-hi); --ico-ink: var(--violet-ink); }
.dusk-ico--grey,
.dusk-row--grey { --ico-edge: var(--tile-grey-hi); --ico-ink: var(--grey-ink); }
.dusk-row--red { --row-neon: var(--rowneon-red); --row-wash: var(--rowwash-red); }
.dusk-row--amber { --row-neon: var(--rowneon-amber); --row-wash: var(--rowwash-amber); }
.dusk-row--green { --row-neon: var(--rowneon-green); --row-wash: var(--rowwash-green); }
.dusk-row--down { --row-neon: var(--rowneon-down); --row-wash: var(--rowwash-down); }
.dusk-row--teal { --row-neon: var(--rowneon-teal); --row-wash: var(--rowwash-teal); }
.dusk-row--blue { --row-neon: var(--rowneon-blue); --row-wash: var(--rowwash-blue); }
.dusk-row--violet { --row-neon: var(--rowneon-violet); --row-wash: var(--rowwash-violet); }
.dusk-row--grey { --row-neon: var(--rowneon-grey); --row-wash: var(--rowwash-grey); }
/* filled: the white glyph on a cap's light end reads at 4.5 or more */
.dusk-ico--solid,
.dusk-row--on .dusk-ico,
.dusk-row[aria-current="page"] .dusk-ico {
  background: var(--ico-edge, var(--tile-grey-hi));
  color: var(--on-tile);
}

.dusk-chev { color: var(--ink-3); font-size: var(--fs-data); }

/* ---- header, button, segments, badge, flag ---------------------------------------------------- */

.dusk-title {
  font-size: var(--fs-title);
  letter-spacing: var(--track-title);
}
.dusk-lede { color: var(--ink-2); }

.dusk-btn {
  border: 0;
  background: var(--btn-bg);
  color: var(--btn-ink);
  border-radius: var(--r-control);
  box-shadow: var(--neon-ctl);
  font-size: var(--fs-s);
  font-weight: var(--fw-medium);
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--m-confirm) var(--ease), box-shadow var(--m-confirm) var(--ease);
}
.dusk-btn:hover { background: var(--btn-bg-hover); box-shadow: var(--neon-ctl-on); }
.dusk-btn:active { background: var(--btn-bg-press); }
.dusk-btn[disabled],
.dusk-btn[aria-disabled="true"] {
  background: var(--wash-1);
  box-shadow: var(--ring-well);
  color: var(--ink-2);
  cursor: not-allowed;
}
.dusk-btn svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* a segmented choice: a sunk track, and the pressed segment is lit */
.dusk-seg {
  background: var(--well);
  border-radius: var(--r-control);
  box-shadow: var(--ring-well);
}
.dusk-seg button {
  border: 0;
  background: none;
  color: var(--ink-2);
  border-radius: var(--r-chip);
  font-size: var(--fs-s);
  font-weight: var(--fw-medium);
  cursor: pointer;
  transition: background-color var(--m-confirm) var(--ease), box-shadow var(--m-confirm) var(--ease);
}
.dusk-seg button:hover { background: var(--wash-1); }
.dusk-seg button[aria-pressed="true"] {
  background: var(--wash-2);
  color: var(--lit);
  box-shadow: var(--neon-ctl);
}

.dusk-badge {
  background: var(--wash-2);
  color: var(--lit);
  border-radius: var(--r-control);
  box-shadow: var(--neon-ctl);
  font-size: var(--fs-s);
  font-weight: var(--fw-medium);
  line-height: 1;
}
.dusk-badge svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.dusk-eye {
  background: var(--lit);
  border-radius: var(--r-circle);
}

.dusk-flag {
  border: 1px dashed var(--amber-ink);
  border-radius: var(--r-control);
  color: var(--amber-ink);
  font-size: var(--fs-s);
}
.dusk-flag::before { content: "■\00a0"; content: "■\00a0" / ""; }

.dusk-note { color: var(--ink-3); font-size: var(--fs-xs); }

/* a count beside a title: a sunk chip with a lit figure */
.dusk-count {
  background: var(--well);
  border: 1px solid var(--lit-rule);
  border-radius: var(--r-chip);
  color: var(--lit);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
}

/* a rule with a name on it: the name, a line of text, and a lit line that fades */
.dusk-rule { color: var(--ink-2); font-size: var(--fs-s); }
.dusk-rule b {
  color: var(--ink-3);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--track-label);
}
.dusk-rule::after {
  content: "";
  background: var(--rule-fade);
}

/* ---- the strip: a row of labelled readings ---------------------------------------------------- */

.dusk-strip {
  background: var(--panel-fill);
  border-radius: var(--r-tile);
  box-shadow: var(--neon);
}
.dusk-cell + .dusk-cell { border-left: 1px solid var(--lit-rule); }
.dusk-cell small {
  color: var(--ink-3);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--track-label);
}
.dusk-cell { color: var(--ink); }
.dusk-cell b {
  font-family: var(--font-mono);
  font-size: var(--fs-base);
  font-weight: var(--fw-medium);
  line-height: 1.2;
}
.dusk-cell--key {
  background: var(--wash-2);
  border-top-left-radius: var(--r-tile);
  border-bottom-left-radius: var(--r-tile);
}
.dusk-cell--key b {
  color: var(--lit);
  font-family: var(--font-ui);
  font-size: var(--fs-l);
  font-weight: var(--fw-bold);
}

/* ---- bar and legend --------------------------------------------------------------------------- */

.dusk-bar {
  background: var(--well);
  border-radius: var(--r-bar);
  box-shadow: var(--ring-well);
  overflow: hidden;
}
.dusk-fill--red   { background: var(--red); }
.dusk-fill--amber   { background: var(--amber); }
.dusk-fill--green   { background: var(--green); }
.dusk-fill--down   { background: var(--down); }
.dusk-fill--teal   { background: var(--teal); }
.dusk-fill--blue   { background: var(--blue); }
.dusk-fill--violet   { background: var(--violet); }
.dusk-fill--grey   { background: var(--grey); }
.dusk-fill--idle   { background: var(--idle); }

.dusk-legend { color: var(--ink-2); font-size: var(--fs-s); }
.dusk-legend i { border-radius: var(--r-circle); }
.dusk-legend b {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: var(--fw-medium);
}

/* ---- tile ----------------------------------------------------------------------------------------
   A dark body under a coloured cap, lit in the tile's own colour. Static state first: on hover and
   focus the edge brightens from --neon-<tone> to --neon-<tone>-on. The lift is added on top of it,
   so under reduced motion the hover is still visible with no movement. */

.dusk-tile {
  --tile-neon: var(--neon);
  --tile-neon-on: var(--neon-on);
  --tile-cap: var(--tile-grey);
  --tile-cap-edge: var(--cap-grey);
  --tile-tint: var(--tint-grey);
  --tile-fill: var(--grey);
  --tile-ink: var(--grey-ink);
  --tile-glow: var(--glow-grey);
  --tile-halo: var(--halo-grey);
  color: var(--ink);
  background-color: var(--panel-hi);
  background-image: var(--tile-tint), var(--panel-fill);
  border-radius: var(--r-tile);
  box-shadow: var(--tile-neon);
  text-decoration: none;
  overflow: hidden;
  transition: transform var(--m-confirm) var(--ease), box-shadow var(--m-confirm) var(--ease);
}
.dusk-tile:hover,
.dusk-tile:focus-within {
  box-shadow: var(--tile-neon-on);
  transform: translateY(var(--lift));
}
.dusk-tile--red {
  --tile-neon: var(--neon-red); --tile-neon-on: var(--neon-red-on);
  --tile-cap: var(--tile-red); --tile-cap-edge: var(--cap-red); --tile-tint: var(--tint-red);
  --tile-fill: var(--red); --tile-ink: var(--red-ink); --tile-glow: var(--glow-red); --tile-halo: var(--halo-red);
}
.dusk-tile--amber {
  --tile-neon: var(--neon-amber); --tile-neon-on: var(--neon-amber-on);
  --tile-cap: var(--tile-amber); --tile-cap-edge: var(--cap-amber); --tile-tint: var(--tint-amber);
  --tile-fill: var(--amber); --tile-ink: var(--amber-ink); --tile-glow: var(--glow-amber); --tile-halo: var(--halo-amber);
}
.dusk-tile--green {
  --tile-neon: var(--neon-green); --tile-neon-on: var(--neon-green-on);
  --tile-cap: var(--tile-green); --tile-cap-edge: var(--cap-green); --tile-tint: var(--tint-green);
  --tile-fill: var(--green); --tile-ink: var(--green-ink); --tile-glow: var(--glow-green); --tile-halo: var(--halo-green);
}
.dusk-tile--down {
  --tile-neon: var(--neon-down); --tile-neon-on: var(--neon-down-on);
  --tile-cap: var(--tile-down); --tile-cap-edge: var(--cap-down); --tile-tint: var(--tint-down);
  --tile-fill: var(--down); --tile-ink: var(--down-ink); --tile-glow: var(--glow-down); --tile-halo: var(--halo-down);
}
.dusk-tile--teal {
  --tile-neon: var(--neon-teal); --tile-neon-on: var(--neon-teal-on);
  --tile-cap: var(--tile-teal); --tile-cap-edge: var(--cap-teal); --tile-tint: var(--tint-teal);
  --tile-fill: var(--teal); --tile-ink: var(--teal-ink); --tile-glow: var(--glow-teal); --tile-halo: var(--halo-teal);
}
.dusk-tile--blue {
  --tile-neon: var(--neon-blue); --tile-neon-on: var(--neon-blue-on);
  --tile-cap: var(--tile-blue); --tile-cap-edge: var(--cap-blue); --tile-tint: var(--tint-blue);
  --tile-fill: var(--blue); --tile-ink: var(--blue-ink); --tile-glow: var(--glow-blue); --tile-halo: var(--halo-blue);
}
.dusk-tile--violet {
  --tile-neon: var(--neon-violet); --tile-neon-on: var(--neon-violet-on);
  --tile-cap: var(--tile-violet); --tile-cap-edge: var(--cap-violet); --tile-tint: var(--tint-violet);
  --tile-fill: var(--violet); --tile-ink: var(--violet-ink); --tile-glow: var(--glow-violet); --tile-halo: var(--halo-violet);
}
.dusk-tile--grey {
  --tile-neon: var(--neon-grey); --tile-neon-on: var(--neon-grey-on);
  --tile-cap: var(--tile-grey); --tile-cap-edge: var(--cap-grey); --tile-tint: var(--tint-grey);
  --tile-fill: var(--grey); --tile-ink: var(--grey-ink); --tile-glow: var(--glow-grey); --tile-halo: var(--halo-grey);
}

.dusk-tile-cap {
  background: var(--tile-cap);
  border-bottom: 1px solid var(--tile-ink);
  box-shadow: var(--tile-cap-edge);
  color: var(--on-tile);
}
/* the icon square on a cap is a sunk dark square: tests/skin05-contrast.mjs measures the white glyph on it over both cap ends */
.dusk-tile-cap .dusk-ico {
  background: var(--tile-glyph);
  border: 0;
  color: var(--on-tile);
}
.dusk-tile-lab {
  font-size: var(--fs-s);
  font-weight: var(--fw-medium);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dusk-tile-chev { color: var(--on-tile); }
.dusk-tile-num {
  font-family: var(--font-mono);
  font-size: var(--fs-num);
  font-weight: var(--fw-medium);
  letter-spacing: var(--track-num);
  line-height: var(--lh-tight);
  text-shadow: var(--tile-halo);
}
.dusk-tile-num small {
  color: var(--ink-3);
  font-size: var(--fs-data);
  font-weight: var(--fw-medium);
  letter-spacing: 0;
  text-shadow: none;
}
.dusk-tile-tag {
  background: var(--well);
  border: 1px solid var(--hair-2);
  border-radius: var(--r-chip);
  color: var(--tile-ink);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  text-shadow: none;
  line-height: 1.3;
  white-space: nowrap;
}
.dusk-tile-sub { color: var(--ink-2); font-size: var(--fs-s); line-height: 1.35; }
.dusk-tile-sub i { color: var(--tile-ink); font-style: normal; }
/* the sparkline: an area in the tile's fill, and a lit line over it */
.dusk-spark path { fill: var(--tile-fill); fill-opacity: var(--tile-spark); stroke: none; }
.dusk-spark .dusk-spark-line {
  fill: none;
  stroke: var(--tile-ink);
  stroke-width: var(--spark-w);
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(var(--tile-glow));
}

/* ---- panel, table, feed ----------------------------------------------------------------------- */

.dusk-panel {
  background: var(--panel-fill);
  border-radius: var(--r-tile);
  box-shadow: var(--neon);
}
.dusk-panel-head {
  background: var(--head);
  border-bottom: 1px solid var(--lit-rule);
  border-top-left-radius: var(--r-tile);
  border-top-right-radius: var(--r-tile);
}
.dusk-panel-name {
  color: var(--ink);
  font-size: var(--fs-data);
  font-weight: var(--fw-medium);
}
.dusk-panel-sub { color: var(--ink-3); font-size: var(--fs-s); }
/* the title of a panel that has no head bar */
.dusk-panel-title {
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--track-label);
}

.dusk-table {
  border-collapse: collapse;
  font-size: var(--fs-data);
}
.dusk-table th,
.dusk-table td { overflow-wrap: anywhere; }
/* a column head and a figure stay on one line; only a cell of words may wrap */
.dusk-table th,
.dusk-table .dusk-r,
.dusk-table td:first-child { white-space: nowrap; overflow-wrap: normal; }
.dusk-table th {
  background: var(--thead);
  border-bottom: 1px solid var(--lit-rule);
  color: var(--ink-3);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  text-align: left;
  text-transform: uppercase;
  letter-spacing: var(--track-label);
}
.dusk-table td { border-top: 1px solid var(--hair); color: var(--ink-2); }
.dusk-table tbody tr:first-child td { border-top: 0; }
.dusk-table th + th,
.dusk-table td + td { border-left: 1px solid var(--hair); }
.dusk-table tbody tr:nth-child(even) td { background: var(--zebra); }
.dusk-table .dusk-r { text-align: right; font-family: var(--font-mono); }
.dusk-table td:first-child { font-family: var(--font-mono); font-weight: var(--fw-medium); }
.dusk-table .dusk-ask td:first-child { color: var(--down-ink); }
.dusk-table .dusk-bid td:first-child { color: var(--up-ink); }
.dusk-table tbody tr.dusk-hot td {
  background: var(--wash-4);
  box-shadow: var(--neon-row);
  color: var(--ink);
  font-weight: var(--fw-medium);
}
.dusk-table .dusk-mid td { border-top: 2px solid var(--hair-2); }
/* a measure drawn in a cell, beside its number */
.dusk-heat { border-radius: var(--r-bar); background: var(--grey); }
.dusk-ask .dusk-heat { background: var(--down); box-shadow: var(--glow-down); }
.dusk-bid .dusk-heat { background: var(--up); box-shadow: var(--glow-green); }

.dusk-feed li { border-top: 1px solid var(--hair); color: var(--ink-2); font-size: var(--fs-data); }
.dusk-feed li:first-child { border-top: 0; }
.dusk-feed time { color: var(--ink-3); font-family: var(--font-mono); font-size: var(--fs-s); }
.dusk-feed em {
  color: var(--ink);
  font-family: var(--font-mono);
  font-style: normal;
  font-weight: var(--fw-medium);
}

/* ---- state words and direction ink ------------------------------------------------------------
   `.dusk-state` writes its own glyph, so the markup carries the word only. `.dusk-up` and `.dusk-down`
   are colour only: the sign and the arrow stay in the text (Dyad rule, kept). */

.dusk-state { font-weight: var(--fw-medium); }
.dusk-state--ok::before      { content: "✔\00a0"; content: "✔\00a0" / ""; }
.dusk-state--up::before      { content: "▲\00a0"; content: "▲\00a0" / ""; }
.dusk-state--down::before    { content: "▼\00a0"; content: "▼\00a0" / ""; }
.dusk-state--caution::before { content: "■\00a0"; content: "■\00a0" / ""; }
.dusk-state--attn::before    { content: "?\00a0"; content: "?\00a0" / ""; }
.dusk-state--hold::before    { content: "‖\00a0"; content: "‖\00a0" / ""; }
.dusk-state--info::before    { content: "●\00a0"; content: "●\00a0" / ""; }
.dusk-state--ok,
.dusk-state--up,
.dusk-up      { color: var(--up-ink); }
.dusk-state--down,
.dusk-down    { color: var(--down-ink); }
.dusk-state--caution { color: var(--amber-ink); }
.dusk-state--attn    { color: var(--attn-ink); }
.dusk-state--info    { color: var(--teal-ink); }
.dusk-state--hold    { color: var(--ink-2); }

/* ---- breakpoint: the sidebar becomes a strip above the content -------------------------------- */

@media (max-width: 760px) {
  .dusk-side {
    border-right: 0;
    border-bottom: 1px solid var(--lit-rule);
  }

  /* WEB-14: the stacked table (layout in dusk.compose.css). The row is the separator now, not the cell,
     and each labelled cell writes its column label from data-label. */
  .dusk-table td,
  .dusk-table .dusk-mid td { border-top: 0; }
  .dusk-table td + td { border-left: 0; }
  .dusk-table tbody tr { border-top: 1px solid var(--hair); }
  .dusk-table tbody tr:first-child { border-top: 0; }
  .dusk-table tbody tr.dusk-mid { border-top: 2px solid var(--hair-2); }
  /* a stacked value reads from the label, left; a right-aligned number would sit apart from it */
  .dusk-table .dusk-r { text-align: left; }
  .dusk-table td[data-label]::before {
    content: attr(data-label);
    color: var(--ink-3);
    font-family: var(--font-ui);
    font-size: var(--fs-xs);
    font-weight: var(--fw-medium);
  }
}

/* ---- process parts: Tier 1 states (CR-2026-10-22-LIVING, B2) ------------------------------------
   The station the prompt has reached brightens its lit edge and stays so (.dusk-station--done); the
   one it is at now also wears a ring on its disc (.dusk-station--here). It is its own
   reduced-motion form: with motion off the transition is cut and the held state is simply there.
   The parts themselves live in dusk.process.css (W-029); their motion lives here, like every
   Tier 1 state. */
.dusk-station > .dusk-panel { transition: box-shadow var(--m-confirm) var(--ease); }
.dusk-station--done > .dusk-panel,
.dusk-station--here > .dusk-panel { box-shadow: var(--neon-on); }
.dusk-station > .dusk-disc { transition: box-shadow var(--m-confirm) var(--ease); }
.dusk-station--here > .dusk-disc { box-shadow: var(--shadow-disc-ring); }

/* ---- reduced motion: Tier 1 -------------------------------------------------------------------
   Every transition stops and the lift stops. The brighter edge, the washes and the focus ring
   stay, so every state is still distinguishable with no movement. A glow is a still shadow. */

@media (prefers-reduced-motion: reduce) {
  .dusk-tile,
  .dusk-btn,
  .dusk-seg button,
  .dusk-row,
  .dusk-station > .dusk-panel,
  .dusk-station > .dusk-disc { transition: none; }
  .dusk-tile:hover,
  .dusk-tile:focus-within { transform: none; }
}

/* ===== dusk.compose.css — verbatim copy, do not edit ===== */
/* dusk.compose.css - layer 4 of 5. Where the parts sit.
   Owns display, grid, flex, gap, padding, margin, size, position and the breakpoint.
   Does not own colour, background, border, corner, shadow or type: those are dusk.components.css.
   The one raw length that cannot be a token is the width in a media query (a custom property cannot
   be read there). It is written once, here. */

/* WEB-14. The page gutter is the one margin: --gutter on all four window edges, and nothing else.
   The stage has no max-width and no auto margins, so it spans the window minus the gutter at every
   width. A text measure caps a text column below (--measure, in ch), never the page.
   A page that is one whole window puts .dusk-stage--app on its stage: the stage takes the gutter
   back, and the window fills the viewport edge to edge, like an application. */
body { padding: var(--gutter); }

.dusk-stage { margin: 0; }
.dusk-stage--app { margin: calc(-1 * var(--gutter)); }
.dusk-stage--app > .dusk-win { min-height: 100vh; }

.dusk-lede,
.dusk-note,
.dusk-measure { max-width: var(--measure); }

.dusk-pair {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--pair-min)), 1fr));
  gap: var(--sp-7);
}

/* ---- window ---------------------------------------------------------------------------------
   Two columns: the sidebar and the content. A title bar, its thread and a status bar span both.
   The content row takes the spare height, so the status bar sits on the window's bottom edge. */

.dusk-win {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  grid-auto-rows: auto;
  align-content: start;
  min-width: 0;
}
.dusk-titlebar,
.dusk-thread,
.dusk-status { grid-column: 1 / -1; }
.dusk-stage--app > .dusk-win { grid-template-rows: auto auto 1fr auto; }

.dusk-titlebar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--gap);
  min-height: var(--bar-h-title);
  padding: var(--sp-2) var(--gap);
}
.dusk-titlebar .dusk-dots { margin: 0; }
.dusk-titlebar .dusk-disc {
  width: var(--disc-size-xs);
  height: var(--disc-size-xs);
  margin: 0;
}
.dusk-titlebar .dusk-flag { margin-top: 0; }
.dusk-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
}
.dusk-crumb i { margin: 0 var(--sp-1); }
.dusk-spacer { flex: 1 1 0; }
.dusk-thread { height: var(--thread-h); }

.dusk-side {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: var(--gap) var(--sp-3);
}
.dusk-side-foot {
  display: grid;
  gap: 2px;
  margin-top: auto;
  padding: var(--sp-4) var(--sp-3) 0;
}

.dusk-status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  min-height: var(--status-h);
}
.dusk-status > span { padding: var(--sp-1) var(--gap); }
.dusk-status > .dusk-spacer { padding: 0; }
.dusk-led {
  display: inline-block;
  width: var(--led-size);
  height: var(--led-size);
  margin-right: var(--sp-2);
}

.dusk-dots {
  display: flex;
  gap: var(--sp-2);
  margin: 0 0 var(--gap) var(--sp-1);
}
.dusk-dots i {
  display: block;
  width: var(--dot-size);
  height: var(--dot-size);
}

.dusk-disc {
  display: grid;
  place-items: center;
  width: var(--disc-size);
  height: var(--disc-size);
  margin: var(--sp-1) auto var(--sp-3);
}
.dusk-who { margin-bottom: var(--gap); }
.dusk-who b,
.dusk-row b,
.dusk-row small { display: block; }
.dusk-grp { margin: var(--sp-5) var(--sp-3) var(--sp-1); }

.dusk-rows {
  display: grid;
  gap: 2px;
}
.dusk-row {
  display: grid;
  grid-template-columns: var(--ico-size) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-4);
  min-height: var(--head-h);
  padding: var(--sp-1) var(--sp-3);
}
.dusk-ico {
  display: grid;
  place-items: center;
  width: var(--ico-size);
  height: var(--ico-size);
}
.dusk-ico svg {
  width: var(--gap);
  height: var(--gap);
}

.dusk-main {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  min-width: 0;
  padding: var(--gap);
}

.dusk-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: var(--sp-5);
}
.dusk-lede { margin-top: 2px; }

.dusk-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--row-h);
  padding: var(--sp-2) var(--gap);
}
.dusk-btn svg {
  width: var(--gap);
  height: var(--gap);
}
.dusk-seg {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
}
.dusk-seg button {
  min-height: var(--ico-size);
  padding: 0 var(--sp-4);
}
.dusk-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--ico-size);
  padding: var(--sp-1) var(--sp-4);
}
.dusk-badge svg {
  width: var(--gap);
  height: var(--gap);
}
.dusk-eye {
  display: inline-block;
  width: var(--legend-dot);
  height: var(--legend-dot);
}
.dusk-flag {
  display: inline-block;
  margin-top: var(--sp-2);
  padding: 3px var(--sp-3);
}
.dusk-note { display: inline-block; }
.dusk-count { padding: 1px var(--sp-2); }

.dusk-rule {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--gap);
  margin: 0;
}
.dusk-rule::after {
  flex: 1 1 var(--sp-8);
  height: 1px;
}

/* ---- the strip -------------------------------------------------------------------------------- */

.dusk-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  min-width: 0;
}
.dusk-cell {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  min-width: 0;
  padding: var(--sp-2) var(--gap);
}
.dusk-strip-end {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  margin-left: auto;
  padding: var(--sp-2) var(--sp-4);
}

/* ---- bar and legend --------------------------------------------------------------------------- */

.dusk-bar {
  display: flex;
  height: var(--bar-h);
}
.dusk-bar > .dusk-fill {
  display: block;
  height: 100%;
}

.dusk-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-7);
  margin-top: var(--sp-3);
}
.dusk-legend > span {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
}
.dusk-legend i {
  display: inline-block;
  width: var(--legend-dot);
  height: var(--legend-dot);
}
.dusk-legend b { margin-left: var(--sp-1); }

/* ---- tiles ------------------------------------------------------------------------------------
   One tile is a column: the cap, then the body. The body is the figure row (the figure, its unit,
   and a tag pushed to the right), the line under it, and the sparkline held to the bottom edge. */

.dusk-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--tile-min)), 1fr));
  gap: var(--sp-4);
}

.dusk-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: var(--tile-h);
}
.dusk-tile-cap {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: var(--cap-h);
  padding: var(--sp-1) var(--sp-3) var(--sp-1) var(--sp-2);
}
.dusk-tile-cap .dusk-ico {
  flex: none;
  width: var(--ico-size-sm);
  height: var(--ico-size-sm);
}
.dusk-tile-lab {
  flex: 1 1 auto;
  min-width: 0;
}
.dusk-tile-body {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  gap: 3px;
  padding: var(--sp-3) var(--sp-4) 0;
}
.dusk-tile-num {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
}
.dusk-tile-num small { margin-left: 3px; }
.dusk-tile-tag {
  align-self: center;
  margin-left: auto;
  padding: 1px var(--sp-2);
}
.dusk-tile-sub { min-height: var(--spark-h); }
.dusk-spark {
  display: block;
  width: 100%;
  height: var(--spark-h);
  margin-top: auto;
}

/* ---- panel, table, feed ----------------------------------------------------------------------- */

.dusk-panels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--panel-min)), 1fr));
  gap: var(--gap);
  align-items: start;
}
.dusk-stack {
  display: grid;
  gap: var(--gap);
  min-width: 0;
}
.dusk-panel {
  min-width: 0;
  padding: var(--sp-5) var(--gap);
}
/* a panel with a head bar: the head and the body carry the padding, the panel carries none */
.dusk-panel--framed { padding: 0; }
.dusk-panel-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-4);
  min-height: var(--head-h);
  padding: var(--sp-1) var(--sp-3) var(--sp-1) var(--gap);
}
.dusk-panel-name { margin: 0; }
.dusk-panel-body { padding: var(--gap); }
.dusk-panel-body--flush { padding: 0; }
.dusk-panel-title { margin: 0 0 var(--sp-3); }

.dusk-table { width: 100%; }
.dusk-table th { padding: var(--sp-2) var(--gap); }
.dusk-table td {
  height: var(--row-h);
  padding: var(--sp-1) var(--gap);
}
/* the column that holds a drawn measure takes a fixed share, so the bars have room */
.dusk-table .dusk-col--bar { width: var(--bar-col); }
.dusk-heat {
  display: block;
  height: var(--heat-h);
  min-width: 2px;
}

.dusk-feed {
  list-style: none;
  margin: 0;
  padding: 0;
}
.dusk-feed li {
  display: grid;
  grid-template-columns: 4.25rem minmax(0, 1fr) auto;
  align-items: baseline;
  gap: var(--gap);
  padding: var(--sp-2) var(--gap);

/* ===== dusk.motion.css — verbatim copy, do not edit ===== */
/* dusk.motion.css - layer 5 of 5. Tier 2 (entrances) and Tier 3 (ambient). Tier 2 is OPEN only.
   Tier 3 is on by default on OPEN and opt-in on STRICT (SKIN-06).
   Writes no `transform` and no `transition`: Tier 1 (the hover lift) owns both and lives in
   dusk.components.css. This file animates `translate` only, through @keyframes. A page with no
   data-tier attribute is STRICT, and nothing below applies to it.

   Contract with the page:
     <html data-tier="open">                 the page's tier line says OPEN
     <html data-tier="open" data-ambient="off">   one attribute turns the ambient layer off (SKIN-06)
     <html data-tier="strict" data-ambient="on">  a STRICT page opts in to the ambient layer only
                                                  (SKIN-06: on STRICT it stays opt-in and off; the
                                                  still wall is its static alternative, SAFE-05)
     .is-in                                   written by the page's observer on a .dusk-enter element
   Nothing here uses opacity, so content is readable if the observer never runs. */

/* ---- Tier 2: entrance -----------------------------------------------------------------------
   Rests a few pixels low. `.is-in` settles it. If `.is-in` never arrives the content is still
   there, still readable, a few pixels out of place. */

html[data-tier="open"] .dusk-enter { translate: 0 var(--enter-shift); }
html[data-tier="open"] .dusk-enter.is-in {
  animation: dusk-enter var(--m-enter) var(--ease) both;
}

@keyframes dusk-enter {
  from { translate: 0 var(--enter-shift); }
  to   { translate: 0 0; }
}

/* ---- Tier 2: the traveller (CR-2026-10-22-LIVING, A1) -----------------------------------------
   One mark rides a process track from the first disc to the last, once, when the page writes
   `.dusk-traveller--riding` on it; it rests at the end (`forwards`). A press writes the class again to replay.
   The distance is the page's to measure: it sets `--travel-y` on the mark (the first disc to the
   last). Without the class, without the script, or with the length unset, the mark sits on the
   first disc. OPEN only. `translate` only. */
html[data-tier="open"] .dusk-track > .dusk-traveller--riding {
  animation: dusk-ride var(--m-ride) linear forwards;
}
@keyframes dusk-ride {
  from { translate: 0 0; }
  to   { translate: 0 var(--travel-y, 0px); }
}

/* ---- Tier 3: ambient ------------------------------------------------------------------------
   The wall drifts, slowly. On the ground only: never on a control or a tile. */

html[data-tier="open"]:not([data-ambient="off"]) body::before,
html[data-tier="strict"][data-ambient="on"] body::before {
  will-change: translate;
  animation: dusk-drift var(--m-drift) ease-in-out infinite alternate;
}

@keyframes dusk-drift {
  from { translate: 0 0; }
  to   { translate: var(--drift-x) var(--drift-y); }
}

/* ---- reduced motion: Tiers 2 and 3 -------------------------------------------------------------
   Every effect stops. `translate: none` is the arrived position, so nothing is left part-way and
   nothing is left out of place. The page is complete without any of it. */

@media (prefers-reduced-motion: reduce) {
  html[data-tier] body::before {
    animation: none !important;
    translate: none !important;
    will-change: auto !important;
  }
  html[data-tier] .dusk-enter,
  html[data-tier] .dusk-enter.is-in {
    animation: none !important;
    translate: none !important;
  }
  html[data-tier] .dusk-track > .dusk-traveller,
  html[data-tier] .dusk-track > .dusk-traveller--riding {

const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);   // same curve as anim.js
const carLen = (type) => (G.types[type] || G.types.box).len;

// point and heading at arclength s on a polyline; extrapolates off both ends.
// Checked against the frozen polyAt at 603 sample points (see the report).
function along(route, s) {
  const segs = [];
  for (let i = 0; i < route.length - 1; i++) {
    const a = route[i], dx = route[i + 1].x - a.x, dy = route[i + 1].y - a.y;
    segs.push({ a, dx, dy, len: Math.hypot(dx, dy) || 1e-6 });
  }
  let g = segs[0], d = s;
  if (s >= 0) {
    let acc = 0; g = null;
    for (const q of segs) { if (s <= acc + q.len) { g = q; d = s - acc; break; } acc += q.len; }
    if (!g) { g = segs[segs.length - 1]; d = s - acc + g.len; }
  }
  return { x: g.a.x + g.dx / g.len * d, y: g.a.y + g.dy / g.len * d, angle: Math.atan2(g.dy, g.dx) };
}

// ---- the view transform: geometry units -> CSS px. It is the only place layout is decided. ----
// wide: one unit is k CSS px, k >= 1.   tall: the yard is turned a quarter turn; geometry x runs
// down the page and geometry y runs across it, so a track is a lane and the page scrolls down.
const WIDE_MIN = G.W;                       // wide only when one unit is at least one CSS px
function makeView(boxW) {
  let v;
  if (boxW >= WIDE_MIN) {
    const k = boxW / G.W;
    v = { mode: 'wide', w: boxW, h: Math.round(G.H * k), a: k, b: 0, c: 0, d: k, e: 0, f: 0, thick: 28 };
  } else {
    const lane = boxW / (G.NTRACK + 1), step = G.sw[0].y - G.sw[1].y, lx = lane / step, ky = 0.7, x0 = -40;
    v = { mode: 'tall', w: boxW, h: Math.round((G.W - x0) * ky), a: 0, b: ky, c: -lx, d: 0,
      e: G.LEAD_Y * lx + lane / 2, f: -x0 * ky, thick: Math.min(46, lane - 6), lane };
  }
  v.pt = (x, y) => ({ x: v.a * x + v.c * y + v.e, y: v.b * x + v.d * y + v.f });
  v.dir = (ang) => { const cx = Math.cos(ang), sy = Math.sin(ang), ux = v.a * cx + v.c * sy, uy = v.b * cx + v.d * sy;
    return { deg: Math.atan2(uy, ux) * 180 / Math.PI, k: Math.hypot(ux, uy) }; };
  return v;
}

// ---- the state on screen ----
let V = null;
let cur = structuredClone(SCENE.before);     // the real mid-game state
let anim = null;                             // { route, engS, cut } while a move plays
let thru = null;                             // { s } while the stress train runs
let moved = false, busy = false, focusSw = -1;

// static scenery, in CSS px
function scenery() {
  const P = (p) => V.pt(p.x, p.y), sw = G.sw.map(P);
  const rails = [];
  rails.push({ a: sw[G.NTRACK - 1], b: P(G.MAIN_OUT), dim: true });
  let prev = P(G.FOOT);
  for (let i = 0; i < G.NTRACK; i++) { rails.push({ a: prev, b: sw[i], dim: true }); prev = sw[i]; }
  rails.push({ a: V.pt(G.LEAD_LEFT, G.LEAD_Y), b: P(G.FOOT), dim: false });
  for (let i = 0; i < G.NTRACK; i++) rails.push({ a: sw[i], b: V.pt(G.TRACK_RIGHT, G.sw[i].y), dim: false });
  const ticks = G.sw.map((s) => { const c = V.pt(s.x + G.CLEAR, s.y), n = V.dir(Math.PI / 2), r = n.deg * Math.PI / 180;
    return { a: { x: c.x - 9 * Math.cos(r), y: c.y - 9 * Math.sin(r) }, b: { x: c.x + 9 * Math.cos(r), y: c.y + 9 * Math.sin(r) } }; });
  const switches = G.sw.map((s, i) => {
    const c = sw[i], up = i < G.NTRACK - 1 ? sw[i + 1] : P(G.MAIN_OUT), tr = V.pt(G.TRACK_RIGHT, s.y);
    const unit = (to) => { const dx = to.x - c.x, dy = to.y - c.y, L = Math.hypot(dx, dy); return { x: c.x + dx / L * 24, y: c.y + dy / L * 24 }; };
    const box = V.mode === 'wide' ? { x: c.x - 74, y: c.y - 22, w: 96, h: 44 } : { x: c.x - V.lane / 2 + 1, y: c.y - 54, w: V.lane - 2, h: 76 };
    const words = V.mode === 'wide' ? { x: c.x - 16, y: c.y, anchor: 'end' } : { x: c.x, y: c.y - 38, anchor: 'middle' };
    return { id: TR[i], c, normalTo: unit(up), reverseTo: unit(tr), box, words };
  });
  const labels = G.sw.map((s, i) => {
    const e = V.pt(G.TRACK_RIGHT, s.y);
    return V.mode === 'wide' ? { id: TR[i], x: e.x + 6, y: e.y - 7, tagY: e.y + 7, anchor: 'start' } : { id: TR[i], x: e.x, y: e.y + 10, tagY: e.y + 24, anchor: 'middle' };
  });
  const lead = V.mode === 'wide' ? { x: 8, y: V.pt(0, G.LEAD_Y).y - 26, anchor: 'start' } : { x: V.pt(0, G.LEAD_Y).x, y: P(G.FOOT).y + 14, anchor: 'middle' };
  return { rails, ticks, switches, labels, lead };
}
const tagOf = (id) => (SCENE.showSecured && cur.tracks[id].length >= 2 ? (cur.secured[id] ? 'TIED' : 'LOOSE') : '');
const linedWord = (id) => (cur.lined[id] === 'reverse' ? 'REVERSE' : 'NORMAL');

// rolling stock, in CSS px: every car and the engine, standing or moving
function stock() {
  const out = [];
  const put = (id, kind, gx, gy, ang, len, type) => { const p = V.pt(gx, gy), d = V.dir(ang);
    out.push({ id, kind, x: p.x, y: p.y, deg: d.deg, len: len * d.k, num: kind === 'eng' ? 'ENG' : (id ? id.split(' ').pop() : ''),
      tag: kind === 'eng' || !id ? '' : (G.types[type] || G.types.box).tag, empty: kind !== 'eng' && id ? cur.loaded[id] === false : false }); };
  for (let i = 0; i < G.NTRACK; i++) {
    const id = TR[i], cars = cur.tracks[id], pos = cur.pos[id];
    for (let k = 0; k < cars.length; k++) { const w = carLen(cur.type[cars[k]]); put(cars[k], 'car', G.sw[i].x + pos[k] + w / 2, G.sw[i].y, 0, w, cur.type[cars[k]]); }
  }
  const route = anim ? anim.route : G.routes.lead, cut = anim ? anim.cut : cur.engine;
  const engS = anim ? anim.engS : (moved ? G.rest.after : G.rest.before);
  let p = along(route, engS); put('ENG', 'eng', p.x, p.y, p.angle, G.ENGLEN);
  let s = engS + G.ENGLEN / 2;
  for (const c of cut) { const w = carLen(cur.type[c]); p = along(route, s + w / 2); put(c, 'car', p.x, p.y, p.angle, w, cur.type[c]); s += w; }
  if (thru) {                                 // stress train: one engine and 14 cars, three with a label
    p = along(G.routes.through, thru.s); put('ENG2', 'eng', p.x, p.y, p.angle, G.ENGLEN);
    s = thru.s - G.ENGLEN / 2;
    for (let k = 0; k < 14; k++) { const lab = k >= 6 && k < 9 ? 'TEST ' + (k - 5) : '', w = 42; p = along(G.routes.through, s - w / 2);
      put(lab || '', 'car', p.x, p.y, p.angle, w, 'box'); out[out.length - 1].key = 'T' + k; s -= w; }
  }
  return out;
}

// ---- reduced motion: the operating-system flag or the app attribute ----
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.reduce === '1';

// ---- tween driver: same behaviour as anim.js play(); records frame times for the measurement ----
function play(steps, onDone) {
  const rec = { stamps: [], script: [] };
  let i = 0, start = null;
  function frame(now) {
    const s0 = performance.now();
    if (start == null) start = now;
    const t = Math.min(1, (now - start) / steps[i].dur);
    steps[i].fn(easeInOut(t));
    R.frame();
    rec.stamps.push(now); rec.script.push(performance.now() - s0);
    if (t >= 1) { i++; start = null; if (i >= steps.length) { onDone(rec); return; } }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function routeLined() { return TR.every((id) => cur.lined[id] === SCENE.needLined[id]); }
function playMove(force) {
  return new Promise((resolve) => {
    if (busy || moved) return resolve(null);
    if (!force && !routeLined()) { say('The route to ' + SCENE.source.move[1] + ' is not lined. The move did not start.'); return resolve(null); }
    const A = SCENE.anim, route = G.routes.move;
    const commit = () => { if (moved) return; const lined = cur.lined; cur = structuredClone(SCENE.after); cur.lined = lined; moved = true; };
    const finish = (rec) => { anim = null; busy = false; R.sync(); R.frame(); mirror(); say(SCENE.after.msg); readout(); __proto.last = rec; resolve(rec); };
    if (reduced()) { commit(); return finish({ stamps: [], script: [], reduced: true }); }   // the move ends at once
    busy = true;
    play([
      { dur: A.phases[0], fn: (t) => { anim = { route, engS: lerp(A.restStart, A.engIn, t), cut: A.cutIn }; } },
      { dur: A.phases[1], fn: (t) => { commit(); anim = { route, engS: lerp(A.engIn, A.restEnd, t), cut: A.cutOut }; } },
    ], finish);
  });
}
function playThrough() {
  return new Promise((resolve) => {
    if (busy) return resolve(null);
    busy = true; const T = SCENE.through;
    play([{ dur: T.dur, fn: (t) => { thru = { s: lerp(T.from, T.to, t) }; } }], (rec) => { thru = null; busy = false; R.frame(); __proto.last = rec; resolve(rec); });
  });
}
function reset() { if (busy) return; cur = structuredClone(SCENE.before); moved = false; anim = null; R.sync(); R.frame(); mirror(); readout(); say('Reset.'); }
function line(i) {
  if (busy) return;
  const id = TR[i]; cur.lined[id] = cur.lined[id] === 'reverse' ? 'normal' : 'reverse';
  R.sync(); R.frame(); mirror(); say(id + ' switch lined ' + cur.lined[id] + '.');
}

// ---- words: the text mirror, the status line, the readout ----
function say(text) { $('msg').textContent = text; }
function readout() { $('readout').textContent = 'Moves ' + cur.moves + ' / par ' + SCENE.source.par; }
function carWords(c) { return c + ' ' + cur.type[c] + (cur.loaded[c] === false ? ' empty' : ''); }
function mirror() {
  const ul = $('mirror'); ul.textContent = '';
  const li = (html) => { const e = document.createElement('li'); e.innerHTML = html; ul.appendChild(e); };
  li('<b>Engine</b> on the lead. ' + (cur.engine.length ? 'It holds ' + cur.engine.length + ' cars: ' + cur.engine.map(carWords).join(', ') + '.' : 'It holds no cars.'));
  for (const id of TR) {
    const n = cur.tracks[id].length, tag = tagOf(id);
    li('<b>' + id + '</b>. Switch lined ' + cur.lined[id] + '. ' + (n ? n + (n === 1 ? ' car' : ' cars') + (tag ? ', ' + tag.toLowerCase() : '') + ', from the switch end: ' + cur.tracks[id].map(carWords).join(', ') + '.' : 'Empty.'));
  }
}

// ---- measurement hooks ----
const __proto = window.__proto = { tech: 'svg', playMove, playThrough, reset, line, last: null, redraws: 0, retokens: 0, firstDraw: null,
  view: () => ({ mode: V.mode, w: V.w, h: V.h }), state: () => cur };

// ==== drawing code: svg (start) ====
const R = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, parent, textContent) => { const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]); if (textContent != null) e.textContent = textContent; if (parent) parent.appendChild(e); return e; };
  const n = (v) => +v.toFixed(2);
  // measurement switch: ?controls=html puts the six switch controls in HTML buttons laid over the SVG
  const HTMLCTL = new URLSearchParams(location.search).get('controls') === 'html';
  let svg, over, gStock, S, sw = [], tags = [];
  const pool = new Map();

  function init() {
    svg = el('svg', HTMLCTL ? { class: 'yt-svg', 'aria-hidden': 'true' } : { class: 'yt-svg', role: 'group', 'aria-label': 'Yard diagram' }, host);
    if (HTMLCTL) { over = document.createElement('div'); over.className = 'yt-over'; host.appendChild(over); }
    layout();
  }
  // static scenery: built once for a view, then left to the browser
  function layout() {
    S = scenery(); svg.textContent = ''; pool.clear(); sw = []; tags = [];
    svg.setAttribute('viewBox', '0 0 ' + V.w + ' ' + V.h); svg.setAttribute('width', V.w); svg.setAttribute('height', V.h);
    const back = el('g', { 'aria-hidden': 'true' }, svg);
    for (const r of S.rails) el('line', { class: 'yt-rail' + (r.dim ? ' yt-rail--dim' : ''), x1: n(r.a.x), y1: n(r.a.y), x2: n(r.b.x), y2: n(r.b.y) }, back);
    for (const t of S.ticks) el('line', { class: 'yt-tick', x1: n(t.a.x), y1: n(t.a.y), x2: n(t.b.x), y2: n(t.b.y) }, back);
    el('text', { x: n(S.lead.x), y: n(S.lead.y), 'text-anchor': S.lead.anchor }, back, 'LEAD');
    for (const l of S.labels) {
      el('text', { x: n(l.x), y: n(l.y), 'text-anchor': l.anchor }, back, l.id);
      tags.push(el('text', { x: n(l.x), y: n(l.tagY), 'text-anchor': l.anchor }, back, ''));
    }
    gStock = el('g', { 'aria-hidden': 'true' }, svg);
    if (over) over.textContent = '';
    S.switches.forEach((s, i) => {
      const g = el('g', HTMLCTL ? { class: 'yt-sw' } : { class: 'yt-sw', role: 'button', tabindex: '0' }, svg);
      if (!HTMLCTL) el('rect', { class: 'yt-hit', x: n(s.box.x), y: n(s.box.y), width: n(s.box.w), height: n(s.box.h), rx: 6 }, g);
      const points = el('line', { class: 'yt-points', x1: n(s.c.x), y1: n(s.c.y) }, g);
      el('rect', { class: 'yt-dia', x: n(s.c.x - 6), y: n(s.c.y - 6), width: 12, height: 12, transform: 'rotate(45 ' + n(s.c.x) + ' ' + n(s.c.y) + ')' }, g);
      let word, b = null;
      if (HTMLCTL) {                            // a native button: the name, the word, the target and the focus ring are HTML
        b = document.createElement('button'); b.type = 'button'; b.className = 'yt-swb yt-swb--' + V.mode;
        Object.assign(b.style, { left: s.box.x.toFixed(1) + 'px', top: s.box.y.toFixed(1) + 'px', width: s.box.w.toFixed(1) + 'px', height: s.box.h.toFixed(1) + 'px' });
        b.innerHTML = '<span>' + s.id + '</span><span class="dusk-sr"> switch, lined </span><span class="yt-swst"></span>';
        b.addEventListener('click', () => line(i)); over.appendChild(b); word = b.lastChild;
      } else {
        const t = el('text', { x: n(s.words.x), y: n(s.words.y), 'text-anchor': s.words.anchor }, g);
        el('tspan', { x: n(s.words.x), dy: '-0.6em' }, t, s.id);
        word = el('tspan', { class: 'yt-swst', x: n(s.words.x), dy: '1.2em' }, t, '');
        g.addEventListener('click', () => line(i));
        g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); line(i); } });
      }
      sw.push({ g, b, points, word, s });
    });
  }
  // state that changes on an action, not on a frame
  function sync() {
    for (const o of sw) {
      const rev = cur.lined[o.s.id] === 'reverse', to = rev ? o.s.reverseTo : o.s.normalTo;
      o.g.dataset.state = rev ? 'reverse' : 'normal';
      if (o.b) o.b.dataset.state = o.g.dataset.state; else o.g.setAttribute('aria-label', o.s.id + ' switch, lined ' + (rev ? 'reverse' : 'normal'));
      o.points.setAttribute('x2', n(to.x)); o.points.setAttribute('y2', n(to.y));
      o.word.textContent = rev ? 'REVERSE' : 'NORMAL';
    }
    S.labels.forEach((l, i) => { const tag = tagOf(l.id); tags[i].textContent = tag; tags[i].setAttribute('class', tag ? 'yt-tag--' + tag.toLowerCase() : ''); });
  }
  // rolling stock: one group per car, moved by its transform; an attribute is written only when it changes
  function frame() {
    __proto.redraws++;
    const seen = new Set();
    for (const b of stock()) {
      const key = b.key || b.id; seen.add(key);
      let o = pool.get(key);
      if (!o) {
        const g = el('g', { class: 'yt-car' + (b.kind === 'eng' ? ' yt-car--eng' : '') + (b.empty ? ' yt-car--empty' : '') }, gStock);
        const r = el('rect', { y: n(-V.thick / 2), height: V.thick, rx: 3 }, g);
        if (b.num) { const t = el('text', { x: 0, y: 0 }, g);
          if (b.tag) { el('tspan', { x: 0, dy: '-0.575em' }, t, b.num); el('tspan', { x: 0, dy: '1.15em' }, t, b.tag); } else t.textContent = b.num; }
        o = { g, r, tf: '', rot: '', len: -1 }; pool.set(key, o);
      }
      const tf = 'translate(' + n(b.x) + ' ' + n(b.y) + ')';
      if (tf !== o.tf) { o.g.setAttribute('transform', tf); o.tf = tf; }
      const rot = 'rotate(' + n(b.deg) + ')';
      if (rot !== o.rot) { o.r.setAttribute('transform', rot); o.rot = rot; }
      const len = n(b.len);
      if (len !== o.len) { o.r.setAttribute('x', -len / 2); o.r.setAttribute('width', len); o.len = len; }
    }
    for (const [key, o] of pool) if (!seen.has(key)) { o.g.remove(); pool.delete(key); }
  }
  return { init, layout, sync, frame };
})();

// ==== drawing code: svg (end) ====
// ---- start ----
V = makeView(host.clientWidth);
R.init(); R.sync(); R.frame(); mirror(); readout();
__proto.firstDraw = performance.now();
new ResizeObserver(() => { const w = host.clientWidth; if (w && w !== V.w) { V = makeView(w); R.layout(); R.sync(); R.frame(); } }).observe(host);
$('play').addEventListener('click', () => playMove(false));
$('reset').addEventListener('click', reset);

</script>
</body>
</html>
